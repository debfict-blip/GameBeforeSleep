<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Before Sleep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2250">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient-glow" aria-hidden="true"></div>
<div id="fxLayer" aria-hidden="true"></div>
<div id="app">
  <header class="topbar">
    <span class="levelPill">Lv. <span id="levelNumber">1</span></span>
    <span class="title">Game Before Sleep</span>
    <button id="restartBtn" class="iconBtn" aria-label="Restart">↻</button>
  </header>

  <div class="statsBar">
    <span class="statPill">⭐ <span id="starsNumber">0</span></span>
    <span class="statPill">👣 <span id="movesNumber">0</span> moves</span>
  </div>

  <main class="board">
    <div id="beltsSection" class="boardSection hidden"></div>
    <div class="boardSection">
      <span class="sectionLabel">Aisle Shelf</span>
      <section id="shelf" class="shelf"></section>
    </div>
  </main>

  <div class="powerBar">
    <button id="hammerBtn" class="powerBtn" aria-label="Hammer: remove one item">
      <span class="power-icon">🔨</span><span class="power-count" id="hammerCount">2</span>
    </button>
    <button id="undoBtn" class="powerBtn" aria-label="Undo last move">
      <span class="power-icon">↩️</span><span class="power-count" id="undoCount">2</span>
    </button>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-card">
      <p id="winMessage">All sorted ✨</p>
      <button id="nextLevelBtn">Next level</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
