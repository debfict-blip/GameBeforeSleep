<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Before Sleep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2250">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient-glow" aria-hidden="true"></div>
<div id="fxLayer" aria-hidden="true"></div>
<div id="app">
  <section id="sortView" class="view">
    <header class="topbar">
      <span class="levelPill">Lv. <span id="levelNumber">1</span></span>
      <span class="title">Game Before Sleep</span>
      <button id="restartBtn" class="iconBtn" aria-label="Restart">↻</button>
    </header>

    <div class="statsBar">
      <span class="statPill">⭐ <span id="starsNumber">0</span></span>
      <span class="statPill">👣 <span id="movesNumber">0</span> moves</span>
    </div>

    <main class="board">
      <div class="boardSection">
        <span class="sectionLabel">Aisle Shelf</span>
        <section id="shelf" class="shelf"></section>
      </div>
    </main>

    <div class="powerBar">
      <button id="hammerBtn" class="powerBtn" aria-label="Hammer: clear a matching triple">
        <span class="power-icon">🔨</span><span class="power-count" id="hammerCount">2</span>
      </button>
      <button id="undoBtn" class="powerBtn" aria-label="Undo last move">
        <span class="power-icon">↩️</span><span class="power-count" id="undoCount">2</span>
      </button>
    </div>

    <div id="winOverlay" class="overlay hidden">
      <div class="overlay-card">
        <p id="winMessage">All sorted ✨</p>
        <button id="nextLevelBtn">Next level</button>
      </div>
    </div>
  </section>

  <section id="codeView" class="view hidden">
    <header class="topbar">
      <span class="levelPill">Lv. <span id="cbLevel">1</span></span>
      <span class="title">Code Breaker</span>
      <button id="cbRestart" class="iconBtn" aria-label="New code">↻</button>
    </header>

    <div class="statsBar">
      <span class="statPill">⭐ <span id="cbStars">0</span></span>
      <span class="statPill">🎯 <span id="cbTries">0</span> tries left</span>
    </div>

    <p id="cbMessage" class="cbMessage"></p>

    <main class="cbBoard">
      <div id="cbRows" class="cbRows"></div>
    </main>

    <div id="cbPalette" class="cbPalette"></div>

    <div class="powerBar">
      <button id="cbHintBtn" class="powerBtn" aria-label="Hint: reveal one position">
        <span class="power-icon">💡</span><span class="power-count" id="cbHintCount">2</span>
      </button>
      <button id="cbBackBtn" class="powerBtn" aria-label="Remove last pick">⌫</button>
      <button id="cbSubmitBtn" class="powerBtn cbSubmit">Check</button>
    </div>

    <div id="cbOverlay" class="overlay hidden">
      <div class="overlay-card">
        <p id="cbOverlayMsg"></p>
        <button id="cbOverlayBtn">Next level</button>
      </div>
    </div>
  </section>

  <nav class="tabBar" aria-label="Games">
    <button class="tabBtn active" data-tab="sortView">🛒 Sort</button>
    <button class="tabBtn" data-tab="codeView">🔐 Code Breaker</button>
  </nav>
</div>
<script src="script.js"></script>
<script src="codebreaker.js"></script>
<script src="tabs.js"></script>
</body>
</html>
