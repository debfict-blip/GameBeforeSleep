<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Before Sleep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2250">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="title">Game Before Sleep</span>
    <button id="restartBtn" class="iconBtn" aria-label="Restart">↻</button>
  </header>

  <main class="board">
    <section id="shelf" class="shelf"></section>
    <section id="tray" class="tray"></section>
  </main>

  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-card">
      <p>All sorted ✨</p>
      <button id="playAgainBtn">Play again</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
